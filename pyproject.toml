[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiocheck"
version = "1.1.4"
description = "音源质量检测：看内容不看标签 —— 带宽/升频/有损溯源判定 + EBU R128 响度 + 元数据取证"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "audiocheck contributors" }]
keywords = ["audio", "flac", "hi-res", "spectrum", "EBU R128", "BS.1770", "loudness", "forensics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "soundfile>=0.12",
  "mutagen>=1.47",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6", "matplotlib>=3.8"]
plot = ["matplotlib>=3.8"]
# 编辑工作站 P1 播放引擎：miniaudio 为 MIT 许可（无 GPL 传染性，已 pip-audit 核过）。
# 仅 GUI/编辑功能需要；分析 CLI 无此依赖。
edit = ["miniaudio>=1.60"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "pip-audit>=2.0"]

[project.urls]
Homepage = "https://github.com/LiaoRanran/audiocheck"
Repository = "https://github.com/LiaoRanran/audiocheck"
Issues = "https://github.com/LiaoRanran/audiocheck/issues"
Changelog = "https://github.com/LiaoRanran/audiocheck/blob/main/CHANGELOG.md"

[project.scripts]
audiocheck = "audiocheck.cli:main"
# ⚠ 不能叫 `audiocheck-edit`——那个名字被下面的 gui-scripts 占着。pip 对
# 同名 console_script 与 gui_script 的落盘顺序不确定（实测 gui 覆盖 cli），
# 结果是**命令行版编辑入口静默消失**、只剩一个会开窗口的 exe。
audiocheck-edit-cli = "audiocheck.edit_cli:main"

[project.gui-scripts]
audiocheck-gui = "audiocheck.ui.app:main"
audiocheck-edit = "audiocheck.ui.editor:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audiocheck = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501 行长：中文字符宽度与西文不同，强制 100 会造成大量无意义折行
# B008 函数调用做默认值：Qt 里 setStyleSheet(theme.qss(t)) 之类的惯用法
# UP031 百分号格式化：本项目刻意统一用 % 而非 f-string，与日志风格一致且更快
ignore = ["E501", "B008", "UP031", "UP032"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E731"]

[tool.coverage.run]
source = ["audiocheck"]
omit = ["*/ui/*"]
