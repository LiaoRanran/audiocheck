[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiocheck"
version = "1.0.0"
description = "音源质量检测：看内容不看标签 —— 带宽/升频/有损溯源判定 + EBU R128 响度 + 元数据取证"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "audiocheck contributors" }]
keywords = ["audio", "flac", "hi-res", "spectrum", "EBU R128", "BS.1770", "loudness", "forensics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "soundfile>=0.12",
  "mutagen>=1.47",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6", "matplotlib>=3.8"]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/LiaoRanran/audiocheck"
Repository = "https://github.com/LiaoRanran/audiocheck"
Issues = "https://github.com/LiaoRanran/audiocheck/issues"
Changelog = "https://github.com/LiaoRanran/audiocheck/blob/main/CHANGELOG.md"

[project.scripts]
audiocheck = "audiocheck.cli:main"

[project.gui-scripts]
audiocheck-gui = "audiocheck.ui.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audiocheck = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.coverage.run]
source = ["audiocheck"]
omit = ["*/ui/*"]
