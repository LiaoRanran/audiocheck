name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12", "3.13"]
    # Qt 控件测试在无显示环境必须走离屏平台（Linux 无 X、CI 无 DISPLAY）。
    # 本项目的 19 个 test_ui_*.py 都 import PySide6 —— 没有这一行会在
    # ubuntu 上直接 "could not connect to display" 崩掉。
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 必须带 gui extra：UI/色图测试 import PySide6 与 matplotlib，
          # 只装 .[dev] 会让 19 个测试文件在 collection 阶段就 ImportError
          # （CI 从未真正跑过 GUI 测试——这里补上）。
          python -m pip install -e ".[dev,gui]"

      - name: 单元测试
        run: python -m pytest -q

      - name: 覆盖率
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m pip install pytest-cov
          python -m pytest --cov=audiocheck --cov-report=term-missing

  color-probes:
    # 确定性色图/配色判据（纯色彩数学，无渲染不确定性）——`--strict` 不达标即红。
    # 与 test job 里的 TestSpectroColormapPerceptualNorms / TestPhaseColormapDivergingNorms
    # 互为双保险：测试钉"色图自身"，探针额外报全量对照（jet 反面参照 / 发散色图）。
    name: 色彩判据探针
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[gui]"
      - name: 色图感知均匀性（inferno ΔE CV ≤ 0.40 + 相位场发散色图）
        run: python packaging/colormap_probe.py --strict
      - name: 配色对照度（文字/非文字/焦点环 ≥ 阈值）
        run: python packaging/palette_report.py --strict

  supply-chain:
    # E2：不可信输入健壮性（畸形语料 + 有界 fuzz）+ SBOM 生成。
    name: 健壮性与供应链
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,gui]"
      - name: 不可信输入健壮性（畸形语料 + fuzz）
        run: python packaging/robustness_probe.py --strict --max-seconds 300
      - name: SBOM 生成
        run: python packaging/sbom.py --out out/sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: out/sbom.json

  mutation:
    # E1.2 变异测试（自实现 AST 注入，不引 cosmic-ray）：限定时长跑核心模块，
    # 分数低于 MIN_SCORE 即红。存活变异体作为**发现**列出（不是失败）。
    name: 变异测试（核心模块）
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,gui]"
      - name: 变异分数 ≥ 基线
        run: python packaging/mutation_probe.py --strict --max-seconds 900

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check src tests packaging

  cli-smoke:
    name: CLI 冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: 生成测试音频并跑一次完整分析
        run: |
          python - <<'PY'
          import numpy as np, soundfile as sf
          from scipy import signal
          fs = 44100
          rng = np.random.default_rng(0)
          x = (rng.standard_normal(fs * 4) * 0.2).astype(np.float32)
          sos = signal.butter(10, 16000 / (fs / 2), btype="low", output="sos")
          y = signal.sosfilt(sos, x).astype(np.float32)
          sf.write("sample.wav", np.column_stack([y, y]), fs, subtype="PCM_16")
          PY
          audiocheck sample.wav --json out.json
          python -c "import json;d=json.load(open('out.json'));assert d[0]['level']=='bad',d[0]['verdict'];print('OK:',d[0]['verdict'])"
